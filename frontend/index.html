<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FestPass</title>
  </head>
  <body>
    <main>
      <h1>FestPass</h1>
      <p>Minimal assessment implementation. Backend health: <span id="health">checking...</span></p>
    </main>
    <script>
      fetch('/api/health')
        .then(response => response.json())
        .then(data => {
          document.getElementById('health').textContent = data.status;
        })
        .catch(() => {
          document.getElementById('health').textContent = 'unavailable';
        });
    </script>
  </body>
</html>
